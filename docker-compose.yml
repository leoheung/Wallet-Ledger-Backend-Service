# One-command developer/demo environment.
#
#   docker compose up --build
#
# This starts PostgreSQL 16, Redis 7 and the Wallet Ledger app (built from
# the Dockerfile in this directory). The app is on http://localhost:8080
# with Swagger UI at /swagger-ui/index.html and health at /actuator/health.
#
# PostgreSQL and Redis are also published on their host ports (5432/6379) so
# you can run the PostgreSQL integration tests directly on the host afterwards:
#
#   docker compose up -d            # middleware only (app is also started)
#   WALLET_PG_USER=postgres WALLET_PG_PASSWORD=postgres ./mvnw verify -Pit
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet_ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Creates wallet_ledger_test so `mvn verify -Pit` works without extra commands.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: wallet-ledger:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy