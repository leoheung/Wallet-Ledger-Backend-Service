# Optional middleware for reviewers who prefer Docker.
# Usage: docker compose up -d
# Then run the app with the "docker" Spring profile:
#   mvn spring-boot:run -Dspring-boot.run.profiles=docker
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet_ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
