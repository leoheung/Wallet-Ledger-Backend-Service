# Fast in-memory tests. H2 runs in PostgreSQL compatibility mode;
# concurrency correctness is validated against real PostgreSQL in *IT.java.
spring:
  datasource:
    url: jdbc:h2:mem:wallet_ledger;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
