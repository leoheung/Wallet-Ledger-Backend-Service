# Run against docker-compose.yml middleware:
#   docker compose up -d
#   mvn spring-boot:run -Dspring-boot.run.profiles=docker
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wallet_ledger
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      # The redis service in docker-compose.yml is published on host port 6379.
      host: ${WALLET_REDIS_HOST:localhost}
      port: ${WALLET_REDIS_PORT:6379}
